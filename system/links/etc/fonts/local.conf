<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Set substitutions for Latin fonts</description>
<!--
  Mark common families with their generics so we'll get
  something reasonable
-->

<!--
  Serif faces
 -->
	<alias>
		<family>Bitstream Vera Serif</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Cambria</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Constantia</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>DejaVu Serif</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Elephant</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Garamond</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Georgia</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Liberation Serif</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Luxi Serif</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>MS Serif</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Nimbus Roman No9 L</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Nimbus Roman</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Palatino Linotype</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Thorndale AMT</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Thorndale</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Times New Roman</family>
		<default><family>serif</family></default>
	</alias>
	<alias>
		<family>Times</family>
		<default><family>serif</family></default>
	</alias>
<!--
  Sans-serif faces
 -->
	<alias>
	    <family>sans-serif</family>
	    <prefer>
		<family>Google Sans Code Nerd</family>
	    </prefer>
	</alias>
	<alias>
		<family>Google Sans Code Nerd</family>
		<default><family>sans-serif</family></default>
	</alias>
	<alias>
		<family>Roboto Mono Nerd</family>
		<default><family>sans-serif</family></default>
	</alias>
	<alias>
		<family>Space Mono Nerd</family>
		<default><family>sans-serif</family></default>
	</alias>
	<alias>
		<family>Arimo Nerd</family>
		<default><family>sans-serif</family></default>
	</alias>
	<alias>
		<family>Helvetica</family>
		<default><family>sans-serif</family></default>
	</alias>
	<alias>
		<family>Verdana</family>
		<default><family>sans-serif</family></default>
	</alias>
<!--
  Monospace faces
 -->
	<alias>
		<family>JetBrains Mono Nerd</family>
		<default><family>monospace</family></default>
	</alias>
<!--
  Fantasy faces
 -->
	<alias>
		<family>Bauhaus Std</family>
		<default><family>fantasy</family></default>
	</alias>
	<alias>
		<family>Cooper Std</family>
		<default><family>fantasy</family></default>
	</alias>
	<alias>
		<family>Copperplate Gothic Std</family>
		<default><family>fantasy</family></default>
	</alias>
	<alias>
		<family>Impact</family>
		<default><family>fantasy</family></default>
	</alias>
<!--
  Cursive faces
  -->
	<alias>
		<family>Comic Sans MS</family>
		<default><family>cursive</family></default>
	</alias>
	<alias>
		<family>ITC Zapf Chancery Std</family>
		<default><family>cursive</family></default>
	</alias>
	<alias>
		<family>Zapfino</family>
		<default><family>cursive</family></default>
	</alias>
<!--
  system-ui
-->
	<alias>
		<family>system-ui</family>
		<prefer>
			<family>Ubuntu Nerd</family>
		</prefer>
	</alias>
</fontconfig>
